name: Agent Reach isolated pilot
on:
  pull_request:
    paths:
      - .github/workflows/agent-reach-pilot.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upstream Agent-Reach in isolated runner (pinned commit)
        run: |
          python -m pip install 'git+https://github.com/Panniantong/Agent-Reach.git@94f06c1969dfc1834001269d79d3ad0972d9dee6'
          agent-reach --version
      - name: Health check installed Agent-Reach
        run: |
          agent-reach doctor --json > agent-reach-doctor.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('agent-reach-doctor.json')
          print("Agent Reach doctor output bytes:",p.stat().st_size)
          try:
              d=json.loads(p.read_text())
              print("Channels checked:", len(d) if hasattr(d, '__len__') else 'unknown')
          except ValueError: print("Doctor JSON unavailable; inspect artifact")
          PY
      - name: Test public Wenxuecity through Agent-Reach web channel
        run: |
          python - <<'PY'
          from agent_reach.channels.web import WebChannel
          from datetime import datetime,timezone
          from pathlib import Path
          import json
          result={'source':'wenxuecity','method':'agent_reach_jina_reader','status':'FAIL','valid_article_body':False}
          url='https://blog.wenxuecity.com/myoverview/82458/'
          try:
              text=WebChannel().read(url)
              sample=text[:2200].lower()
              challenge=any(s in sample for s in ('captcha','cloudflare','just a moment','security verification'))
              result['chars']=len(text)
              result['status']='PARTIAL' if challenge or len(text)<300 else 'RECEIVED_UNVERIFIED'
              result['reason']='challenge_or_short' if challenge or len(text)<300 else 'content_received_not_verified_article'
          except Exception as e:
              result['reason']=type(e).__name__
              result['error_excerpt']=str(e)[:200]
          Path('agent-reach-wxc.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Test YouTube upstream subtitles with Agent-Reach installed
        run: |
          python scripts/source_access_probe.py --output agent-reach-youtube-baseline.json
      - name: Upload diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-reach-isolated-pilot
          path: |
            agent-reach-doctor.json
            agent-reach-wxc.json
            agent-reach-youtube-baseline.json
          retention-days: 7
