name: Autonomous QA & Security
on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Daily Dashboard Update"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: autonomous-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install PR Python dependencies
        run: pip install "yfinance>=0.2.65,<0.3" pandas
      - name: V5.6 deterministic validation
        run: |
          node --check docs/assets/options-v2.js
          node --check docs/assets/autonomous-agent.js
          node --check docs/assets/decision-journal.js
          node --check docs/assets/wenxuecity.js
          python tests/test_v540_learning_engine_core.py
          python tests/test_v550_autonomous_agent.py
          python tests/test_v560_autonomous_decision_intelligence.py
          python tests/test_v561_premium_income_purpose.py
          python tests/test_v562_autonomous_learning_loop.py
          python tests/test_v563_data_integrity_edge_ui.py
          python tests/test_v564_learning_policy.py
          python tests/test_source_intelligence_engine.py
          python tests/test_source_intelligence_ui.py
          python tests/test_source_history_cache.py
          python tests/test_source_outcome_validation.py
          python tests/test_v570_evidence_attribution.py
          python tests/test_method_memory_engine.py
          python tests/test_v610_module_intelligence.py
          python tests/test_v600_research_planner.py
          python tests/test_v630_official_evidence.py
          python tests/test_v620_research_executor.py
          python tests/test_v700_self_improvement.py
          python tests/test_system_status_center.py
      - name: Public static privacy guard
        run: |
          if grep -R -n -E '"(option_positions|private_positions|broker_account_id)"' docs/research docs/data.json 2>/dev/null; then
            echo 'Private option position material detected in public static output'; exit 1;
          fi
          echo 'Private static export guard PASS'

  deployment-qa:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Public bundle secret exposure guard
        run: |
          if grep -R -n -E 'sb_secret_|service_role[^A-Za-z0-9_]' docs/ --exclude='*.map'; then
            echo 'Potential privileged secret material found in public docs/'; exit 1;
          fi
          echo 'Public bundle secret scan PASS'
      - name: Verify deployed build matches repository build
        run: python scripts/verify_deployment.py --base-url https://myalphaview.com --timeout 600
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser autonomous QA
        env:
          BASE_URL: https://myalphaview.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
        run: node scripts/autonomous_site_qa.mjs
      - name: Upload sanitized QA report and public screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-qa-${{ github.run_number }}
          path: qa-artifacts/
          retention-days: 14

  codeql:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript','python']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
