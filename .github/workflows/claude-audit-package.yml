name: Claude Audit Package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/claude-audit-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create complete main ZIP
        run: |
          SHA="$(git rev-parse HEAD)"
          git archive --format=zip --prefix="MyAlpha-View-main-${SHA}/" -o MyAlpha_View_main_Claude_Audit.zip HEAD
          printf '%s\n' "$SHA" > CLAUDE_AUDIT_COMMIT.txt
          unzip -t MyAlpha_View_main_Claude_Audit.zip >/dev/null

      # kr-0.3.2 D4 (GPT #133 6625522839): this package is `git archive` of the PUBLIC main branch only: tracked files,
      # no secrets, no runtime outputs, no other artifacts. Its tests/fixtures/privacy_canary/* hold PUBLIC TEST
      # canaries (not production canaries), so a content scan would always fail by design; instead the package is
      # verified to contain exactly the tracked files of the commit it names, and nothing else.
      - name: Verify the package is exactly the public tracked tree
        id: privacy_guard
        run: |
          SHA="$(cat CLAUDE_AUDIT_COMMIT.txt)"
          git ls-files -z | tr '\0' '\n' | sed "s|^|MyAlpha-View-main-${SHA}/|" | sort > expected.txt
          unzip -Z1 MyAlpha_View_main_Claude_Audit.zip | grep -v '/$' | sort > actual.txt
          diff -u expected.txt actual.txt
          test "$(git rev-parse HEAD)" = "$SHA"
          git status --porcelain --untracked-files=no | (! grep .)
          echo "PASS package = git archive of public main ${SHA}: $(wc -l < actual.txt) tracked files, nothing else"

      - name: Upload Claude audit package
        if: steps.privacy_guard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MyAlpha-View-main-Claude-Audit
          path: |
            MyAlpha_View_main_Claude_Audit.zip
            CLAUDE_AUDIT_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
