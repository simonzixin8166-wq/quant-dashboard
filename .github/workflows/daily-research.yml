name: MyAlpha Auto Research

# Idempotent fallback / recovery for the automatic research job (normally run inside Daily Dashboard Update).
# Writes nothing if the session was already researched. Shadow-only; zero paid APIs.
on:
  schedule:
    - cron: '35 0 * * 2-6'
    - cron: '35 12 * * 2-6'
  workflow_dispatch:
    inputs:
      run_reason:
        description: "Why this run was started"
        required: false
        default: ""
      sec_only:
        description: "Refresh SEC fundamentals only (no research records)"
        required: false
        default: "false"

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reason != '' && format('MyAlpha Auto Research · {0}', inputs.run_reason) || 'MyAlpha Auto Research' }}

permissions:
  contents: write

concurrency:
  group: myalpha-production-writer
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: |
          python tests/test_daily_research_job.py
          python tests/test_sec_fundamentals.py
      - name: SEC XBRL fundamentals (official, free; failures → unavailable)
        continue-on-error: true
        run: python scripts/sec_fundamentals.py
      - name: Automatic research (ingestion → eligibility → evidence → analysis → shadow-write → revisit)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sec_only != 'true' }}
        run: python scripts/daily_research_job.py
      - name: Weekly research report (trailing five sessions)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sec_only != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/weekly_research_report.py
      - name: Homepage research digest (reads the journal; no network)
        run: python scripts/auto_research_digest.py
      # P0-A (#133 6148675138): the 12:35Z run lands minutes after the 08:30 ET BLS release, so the official CPI
      # outcome reaches the homepage without a new cron. Before the release it only refreshes; Shadow-only, non-blocking.
      - name: Macro event outcomes + tranche Shadow + homepage event row (Shadow, non-blocking)
        id: macro_event_watch
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/macro_official_outcomes.py
          python scripts/brightline_tranche_shadow.py
          python scripts/macro_event_watch.py
      - name: Record macro event watch failure
        if: steps.macro_event_watch.outcome == 'failure'
        run: python scripts/module_failure_marker.py macro_event_watch
      - name: Save shadow journal only
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add research/knowledge/auto_research_journal.jsonl docs/research/auto_research_status.json docs/research/sec_fundamentals.json docs/research/weekly_research_report.json docs/research/auto_research_digest.json docs/research/macro_event_watch.json research/macro_events/
          if [ -f docs/research/module_failures.json ]; then git add docs/research/module_failures.json; fi
          git diff --cached --quiet || (git commit -m "auto research shadow journal" && git pull --rebase origin main && git push)
