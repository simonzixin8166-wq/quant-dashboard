name: Daily Dashboard Update

on:
  push:
    branches: [main]
    paths:
      - ".github/daily.trigger"
  schedule:
    # 🕒 任务 1：美股收盘后全面更新 (含全市场宽度计算)
    # 对应北京时间：周二到周六 早上 05:30 (UTC 时间 21:30)
    - cron: '30 21 * * 1-5'
    
    # 🕒 任务 2：A股/港股收盘后的轻量快照更新 (跳过美股宽度重计算)
    # 对应北京时间：周一到周五 下午 16:15 (UTC 时间 08:15)
    - cron: '15 8 * * 1-5'
    
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Every workflow that writes generated production artifacts to main shares
  # one lock. This prevents successful builds from failing only at git push.
  group: myalpha-production-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # 使用维护中的 0.2.x 版本；旧版 0.2.51 在 GitHub Actions 批量下载时会返回空表。
      - name: Install dependencies
        run: pip install "yfinance>=0.2.65,<0.3" pandas

      - name: Validate scripts before execution
        run: python -m py_compile scripts/app_version.py scripts/fetch_and_build.py scripts/opportunity_strategy.py scripts/update_market_events.py scripts/backtest_assistant_rules.py scripts/local_history_agent.py scripts/fred_client.py scripts/update_fred_macro.py scripts/cross_asset_divergence_engine.py scripts/breadth_intelligence_engine.py scripts/regime_combination_memory.py scripts/learning_engine_core.py scripts/autonomous_research_agent.py scripts/source_intelligence_engine.py scripts/source_history_cache.py scripts/source_outcome_validation.py scripts/evidence_attribution_engine.py scripts/method_memory_engine.py scripts/module_intelligence_engine.py scripts/autonomous_research_planner.py scripts/official_evidence_engine.py scripts/event_evidence_engine.py scripts/event_window_attribution.py scripts/autonomous_research_executor.py scripts/self_improvement_engine.py scripts/learning_evaluation_engine.py scripts/system_status_center.py scripts/playbook_config.py scripts/trading_calendar.py scripts/private_ledger.py scripts/playbook_engine.py scripts/range_intelligence.py scripts/private_guardrail.py scripts/module_failure_marker.py scripts/playbook_watchdog.py scripts/playbook_outcome_engine.py scripts/walk_forward_replay.py scripts/bootstrap_replay_history.py scripts/controlled_learning_policy.py scripts/forward_learning_feedback.py scripts/challenger_experiment_runner.py scripts/source_reading_memory.py scripts/source_rule_lifecycle.py

      - name: Update official FOMC and CPI calendar
        continue-on-error: true
        run: python scripts/update_market_events.py

      - name: Fetch prices and build site
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_and_build.py

      - name: Bootstrap / refresh Replay history dependencies
        id: replay_history_bootstrap
        continue-on-error: true
        run: python scripts/bootstrap_replay_history.py

      - name: Record Replay history bootstrap failure
        if: steps.replay_history_bootstrap.outcome == 'failure'
        run: python scripts/module_failure_marker.py replay_history_bootstrap

      - name: Update local STOOQ history and autonomous learning
        run: python scripts/local_history_agent.py

      - name: Build V6.10a Playbook state and Silent Ledger bridge
        id: playbook_engine
        continue-on-error: true
        env:
          MYALPHA_LEDGER_REPO: ${{ vars.MYALPHA_LEDGER_REPO || 'simonzixin8166-wq/myalpha-ledger-private' }}
          MYALPHA_LEDGER_TOKEN: ${{ secrets.MYALPHA_LEDGER_TOKEN }}
          MYALPHA_LEDGER_BRANCH: main
          MYALPHA_PLAYBOOK_ALERTS_ENABLED: "false"
          MYALPHA_CP_01_ENABLED: ${{ vars.MYALPHA_CP_01_ENABLED || 'true' }}
          MYALPHA_CP_01_LEDGER_ENABLED: ${{ vars.MYALPHA_CP_01_LEDGER_ENABLED || 'true' }}
          MYALPHA_CP_02_ENABLED: ${{ vars.MYALPHA_CP_02_ENABLED || 'true' }}
          MYALPHA_CP_02_LEDGER_ENABLED: ${{ vars.MYALPHA_CP_02_LEDGER_ENABLED || 'true' }}
          MYALPHA_CP_03_ENABLED: ${{ vars.MYALPHA_CP_03_ENABLED || 'true' }}
          MYALPHA_CP_03_LEDGER_ENABLED: ${{ vars.MYALPHA_CP_03_LEDGER_ENABLED || 'true' }}
        run: python scripts/playbook_engine.py

      - name: Record Playbook engine failure without blocking website
        if: steps.playbook_engine.outcome == 'failure'
        run: python scripts/module_failure_marker.py playbook_engine

      - name: Build V6.11 Outcome Foundation (shadow-only)
        id: playbook_outcomes
        continue-on-error: true
        env:
          MYALPHA_LEDGER_REPO: ${{ vars.MYALPHA_LEDGER_REPO || 'simonzixin8166-wq/myalpha-ledger-private' }}
          MYALPHA_LEDGER_TOKEN: ${{ secrets.MYALPHA_LEDGER_TOKEN }}
          MYALPHA_LEDGER_BRANCH: main
        run: python scripts/playbook_outcome_engine.py

      - name: Record Outcome Foundation failure without blocking website
        if: steps.playbook_outcomes.outcome == 'failure'
        run: python scripts/module_failure_marker.py playbook_outcome_foundation

      - name: Build V6.11 Walk-Forward Replay (research-only)
        id: walk_forward_replay
        continue-on-error: true
        run: python scripts/walk_forward_replay.py

      - name: Record Replay failure without blocking website
        if: steps.walk_forward_replay.outcome == 'failure'
        run: python scripts/module_failure_marker.py walk_forward_replay

      - name: Build V6.12.1 Forward Learning Feedback + Challenger Shadow
        id: forward_learning_feedback
        continue-on-error: true
        run: python scripts/forward_learning_feedback.py

      - name: Record Forward Learning Feedback failure
        if: steps.forward_learning_feedback.outcome == 'failure'
        run: python scripts/module_failure_marker.py forward_learning_feedback

      - name: Build V6.13 Challenger Experiment Runner (preregistered shadow)
        id: challenger_experiments
        continue-on-error: true
        run: python scripts/challenger_experiment_runner.py

      - name: Record Challenger Experiment failure
        if: steps.challenger_experiments.outcome == 'failure'
        run: python scripts/module_failure_marker.py challenger_experiments

      - name: Build V6.10b Market Location Research (research-only)
        id: market_location
        continue-on-error: true
        run: python scripts/range_intelligence.py

      - name: Record Market Location failure without blocking website
        if: steps.market_location.outcome == 'failure'
        run: python scripts/module_failure_marker.py market_location_research

      - name: Update FRED point-in-time macro context
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_fred_macro.py

      - name: Build V6.7 Cross-Asset Divergence
        run: python scripts/cross_asset_divergence_engine.py

      - name: Build V6.8 Breadth Intelligence
        run: python scripts/breadth_intelligence_engine.py

      - name: Build V6.8 Regime Combination Memory
        run: python scripts/regime_combination_memory.py

      - name: Build Learning Engine Core
        run: python scripts/learning_engine_core.py

      - name: Build Autonomous Research Agent
        run: python scripts/autonomous_research_agent.py

      - name: Build Source Intelligence Learning
        run: python scripts/source_intelligence_engine.py

      - name: Build V6.14 Source Reading Memory
        id: source_reading_memory
        continue-on-error: true
        run: python scripts/source_reading_memory.py

      - name: Record Source Reading Memory failure
        if: steps.source_reading_memory.outcome == 'failure'
        run: python scripts/module_failure_marker.py source_reading_memory

      - name: Autofill missing source-validation history
        run: python scripts/source_history_cache.py

      - name: Validate External Source Outcomes
        run: python scripts/source_outcome_validation.py

      - name: Build V6.14.5 Structured Source Rule Lifecycle
        id: source_rule_lifecycle
        continue-on-error: true
        run: python scripts/source_rule_lifecycle.py

      - name: Record Source Rule Lifecycle failure
        if: steps.source_rule_lifecycle.outcome == 'failure'
        run: python scripts/module_failure_marker.py source_rule_lifecycle

      - name: Build Evidence Attribution Learning
        run: python scripts/evidence_attribution_engine.py

      - name: Build Method Memory
        run: python scripts/method_memory_engine.py

      - name: Audit Module Intelligence Graph
        run: python scripts/module_intelligence_engine.py

      - name: Build V6.13.2 Controlled Learning Policy
        id: controlled_learning
        continue-on-error: true
        run: python scripts/controlled_learning_policy.py

      - name: Record Controlled Learning failure without blocking website
        if: steps.controlled_learning.outcome == 'failure'
        run: python scripts/module_failure_marker.py controlled_learning_policy

      - name: Build Autonomous Research Planner
        run: python scripts/autonomous_research_planner.py

      - name: Build Official Evidence Layer
        run: python scripts/official_evidence_engine.py

      - name: Build Event & Peer Evidence Layer
        run: python scripts/event_evidence_engine.py

      - name: Build Event Window Attribution
        run: python scripts/event_window_attribution.py

      - name: Build Autonomous Research Executor
        run: python scripts/autonomous_research_executor.py

      - name: Build Self-Improvement Shadow Engine
        run: python scripts/self_improvement_engine.py

      - name: Build V6.9 Learning Evaluation
        run: python scripts/learning_evaluation_engine.py

      - name: Build autonomous system status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/system_status_center.py

      - name: Validate assistant market alert rules
        continue-on-error: true
        run: python scripts/backtest_assistant_rules.py --period 5y --skip-if-no-new-data

      - name: Generate immutable build manifest
        run: python scripts/generate_build_manifest.py

      - name: Verify generated dashboard contract
        run: |
          node --check docs/assets/options-v2.js
          node --check docs/assets/investment-assistant.js
          node --check docs/assets/autonomous-agent.js
          node --check docs/assets/decision-journal.js
          node --check docs/assets/research-methods.js
          node --check docs/assets/knowledge.js
          node --check docs/assets/market-live.js
          node --check docs/assets/dashboard-v2.2.js
          node --check docs/assets/roll-manager.js
          node --check docs/assets/stock-watchlist.js
          node --check docs/assets/site-analytics.js
          node --check docs/assets/opportunity-radar.js
          node --check docs/assets/autonomous-qa.js
          node tests/options_v2.test.js
          node tests/roll_manager.test.js
          node tests/opportunity_radar.test.js
          python tests/test_opportunity_strategy.py
          python tests/test_breadth.py
          python tests/test_market_events.py
          python tests/test_vix_gauge.py
          python tests/test_decision_ui.py
          python tests/test_build_contract.py
          python tests/test_v510_autonomous_assistant.py
          python tests/test_v520_decision_journal.py
          python tests/test_v530_local_history_agent.py
          python tests/test_v540_learning_engine_core.py
          python tests/test_v550_autonomous_agent.py
          python tests/test_v560_autonomous_decision_intelligence.py
          python tests/test_v561_premium_income_purpose.py
          python tests/test_v562_autonomous_learning_loop.py
          python tests/test_v563_data_integrity_edge_ui.py
          python tests/test_v564_learning_policy.py
          python tests/test_source_intelligence_engine.py
          python tests/test_source_intelligence_ui.py
          python tests/test_source_history_cache.py
          python tests/test_source_outcome_validation.py
          python tests/test_v570_evidence_attribution.py
          python tests/test_method_memory_engine.py
          python tests/test_v610_module_intelligence.py
          python tests/test_v660_information_architecture.py
          python tests/test_v661_ui_consistency.py
          python tests/test_v663_completed_daily_guard.py
          python tests/test_v670_cross_asset_divergence.py
          python tests/test_v680_breadth_intelligence.py
          python tests/test_v681_regime_combination_memory.py
          python tests/test_v680_breadth_ui.py
          python tests/test_v600_research_planner.py
          python tests/test_v630_official_evidence.py
          python tests/test_v640_event_evidence.py
          python tests/test_v650_event_window_attribution.py
          python tests/test_v620_research_executor.py
          python tests/test_v700_self_improvement.py
          python tests/test_v690_learning_evaluation.py
          python tests/test_v690_ui_hardening.py
          python tests/test_ui_controls.py
          python tests/test_system_status_center.py
          python tests/test_v610a_playbook_engine.py
          python tests/test_v610b_parallel_safety.py
          python tests/test_v610c_stabilization_p1.py
          python tests/test_v611_outcome_foundation.py
          python tests/test_v610d_late_detection.py
          python tests/test_v611_walk_forward_replay.py
          python tests/test_v611_replay_dependency_expansion.py
          python tests/test_v612_controlled_learning.py
          python tests/test_v612_production_writer_serialization.py
          python tests/test_v6121_forward_learning_feedback.py
          python tests/test_v613_challenger_experiments.py
          python tests/test_v6131_method_memory_attribution.py
          python tests/test_v6132_method_evidence_state_unification.py
          python tests/test_v6133_method_learning_followup.py
          python tests/test_v6134_method_evidence_ui.py
          python tests/test_v614_source_reading_memory.py
          python tests/test_v6141_source_writer_parity.py
          python tests/test_v6143_source_rule_validation_queue.py
          python tests/test_v6144_research_fairness_slot.py
          python scripts/private_guardrail.py  # Public Leak Guard
          python -m py_compile scripts/generate_build_manifest.py scripts/verify_deployment.py
        
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/ data/history/stooq_watchlist.zip
          if [ -f data/history/source_validation_history.zip ]; then git add data/history/source_validation_history.zip; fi
          git commit -m "Daily update $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main
