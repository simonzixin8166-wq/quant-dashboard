name: Daily Dashboard Update

on:
  push:
    branches: [main]
    paths:
      - ".github/daily.trigger"
  schedule:
    # 🕒 任务 1：美股收盘后全面更新 (含全市场宽度计算)
    # 对应北京时间：周二到周六 早上 05:30 (UTC 时间 21:30)
    - cron: '30 21 * * 1-5'
    
    # 🕒 任务 2：A股/港股收盘后的轻量快照更新 (跳过美股宽度重计算)
    # 对应北京时间：周一到周五 下午 16:15 (UTC 时间 08:15)
    - cron: '15 8 * * 1-5'
    
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Every workflow that writes generated production artifacts to main shares
  # one lock. This prevents successful builds from failing only at git push.
  group: myalpha-production-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # 使用维护中的 0.2.x 版本；旧版 0.2.51 在 GitHub Actions 批量下载时会返回空表。
      - name: Install dependencies
        run: pip install "yfinance>=0.2.65,<0.3" pandas

      - name: Validate scripts before execution
        run: python -m py_compile scripts/fetch_and_build.py scripts/opportunity_strategy.py scripts/update_market_events.py scripts/backtest_assistant_rules.py scripts/local_history_agent.py scripts/fred_client.py scripts/update_fred_macro.py scripts/cross_asset_divergence_engine.py scripts/breadth_intelligence_engine.py scripts/regime_combination_memory.py scripts/learning_engine_core.py scripts/autonomous_research_agent.py scripts/source_intelligence_engine.py scripts/source_history_cache.py scripts/source_outcome_validation.py scripts/evidence_attribution_engine.py scripts/method_memory_engine.py scripts/module_intelligence_engine.py scripts/autonomous_research_planner.py scripts/official_evidence_engine.py scripts/event_evidence_engine.py scripts/event_window_attribution.py scripts/autonomous_research_executor.py scripts/self_improvement_engine.py scripts/system_status_center.py

      - name: Update official FOMC and CPI calendar
        continue-on-error: true
        run: python scripts/update_market_events.py

      - name: Fetch prices and build site
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_and_build.py

      - name: Update local STOOQ history and autonomous learning
        run: python scripts/local_history_agent.py

      - name: Update FRED point-in-time macro context
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_fred_macro.py

      - name: Build V6.7 Cross-Asset Divergence
        run: python scripts/cross_asset_divergence_engine.py

      - name: Build V6.8 Breadth Intelligence
        run: python scripts/breadth_intelligence_engine.py

      - name: Build V6.8 Regime Combination Memory
        run: python scripts/regime_combination_memory.py

      - name: Build V5.4 Learning Engine Core
        run: python scripts/learning_engine_core.py

      - name: Build V5.5 Autonomous Research Agent
        run: python scripts/autonomous_research_agent.py

      - name: Build Source Intelligence Learning
        run: python scripts/source_intelligence_engine.py

      - name: Autofill missing source-validation history
        run: python scripts/source_history_cache.py

      - name: Validate External Source Outcomes
        run: python scripts/source_outcome_validation.py

      - name: Build V5.7 Evidence Attribution Learning
        run: python scripts/evidence_attribution_engine.py

      - name: Build V5.9 Method Memory
        run: python scripts/method_memory_engine.py

      - name: Audit V6.1 Module Intelligence Graph
        run: python scripts/module_intelligence_engine.py

      - name: Build V6 Autonomous Research Planner
        run: python scripts/autonomous_research_planner.py

      - name: Build V6.3 Official Evidence Layer
        run: python scripts/official_evidence_engine.py

      - name: Build V6.4 Event & Peer Evidence Layer
        run: python scripts/event_evidence_engine.py

      - name: Build V6.5 Event Window Attribution
        run: python scripts/event_window_attribution.py

      - name: Build V6.2 Autonomous Research Executor
        run: python scripts/autonomous_research_executor.py

      - name: Build V7 Self-Improvement Shadow Engine
        run: python scripts/self_improvement_engine.py

      - name: Build autonomous system status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/system_status_center.py

      - name: Validate assistant market alert rules
        continue-on-error: true
        run: python scripts/backtest_assistant_rules.py --period 5y --skip-if-no-new-data

      - name: Generate immutable build manifest
        run: python scripts/generate_build_manifest.py

      - name: Verify generated dashboard contract
        run: |
          node --check docs/assets/options-v2.js
          node --check docs/assets/investment-assistant.js
          node --check docs/assets/autonomous-agent.js
          node --check docs/assets/decision-journal.js
          node --check docs/assets/research-methods.js
          node --check docs/assets/market-live.js
          node --check docs/assets/dashboard-v2.2.js
          node --check docs/assets/roll-manager.js
          node --check docs/assets/stock-watchlist.js
          node --check docs/assets/site-analytics.js
          node --check docs/assets/opportunity-radar.js
          node --check docs/assets/autonomous-qa.js
          node tests/options_v2.test.js
          node tests/roll_manager.test.js
          node tests/opportunity_radar.test.js
          python tests/test_opportunity_strategy.py
          python tests/test_breadth.py
          python tests/test_market_events.py
          python tests/test_vix_gauge.py
          python tests/test_decision_ui.py
          python tests/test_build_contract.py
          python tests/test_v510_autonomous_assistant.py
          python tests/test_v520_decision_journal.py
          python tests/test_v530_local_history_agent.py
          python tests/test_v540_learning_engine_core.py
          python tests/test_v550_autonomous_agent.py
          python tests/test_v560_autonomous_decision_intelligence.py
          python tests/test_v561_premium_income_purpose.py
          python tests/test_v562_autonomous_learning_loop.py
          python tests/test_v563_data_integrity_edge_ui.py
          python tests/test_v564_learning_policy.py
          python tests/test_source_intelligence_engine.py
          python tests/test_source_intelligence_ui.py
          python tests/test_source_history_cache.py
          python tests/test_source_outcome_validation.py
          python tests/test_v570_evidence_attribution.py
          python tests/test_method_memory_engine.py
          python tests/test_v610_module_intelligence.py
          python tests/test_v660_information_architecture.py
          python tests/test_v661_ui_consistency.py
          python tests/test_v663_completed_daily_guard.py
          python tests/test_v670_cross_asset_divergence.py
          python tests/test_v680_breadth_intelligence.py
          python tests/test_v681_regime_combination_memory.py
          python tests/test_v680_breadth_ui.py
          python tests/test_v600_research_planner.py
          python tests/test_v630_official_evidence.py
          python tests/test_v640_event_evidence.py
          python tests/test_v650_event_window_attribution.py
          python tests/test_v620_research_executor.py
          python tests/test_v700_self_improvement.py
          python -m py_compile scripts/generate_build_manifest.py scripts/verify_deployment.py
        
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/ data/history/stooq_watchlist.zip
          if [ -f data/history/source_validation_history.zip ]; then git add data/history/source_validation_history.zip; fi
          git commit -m "Daily update $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main
