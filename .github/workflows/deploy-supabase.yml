name: Deploy Supabase Functions

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/202610080002_investment_plans_private.sql'
      - 'supabase/migrations/202610080003_dca_amount_usd.sql'
      - 'supabase/tests/v611_rls_isolation.sql'
      - 'supabase/migrations/202610090001_forward_journal_private.sql'
      - 'supabase/tests/forward_journal_isolation.sql'
      - 'supabase/migrations/202610100001_option_assignment_preference.sql'
      - 'supabase/tests/option_assignment_preference_audit.sql'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
      - name: Deploy market functions
        run: |
          supabase functions deploy options-market --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy stock-market --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy market-snapshot --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Apply V6.11 private investment-plan migrations (idempotent, owner-only RLS)
        # Only this explicitly listed, idempotent file is applied; earlier migrations were applied
        # manually in the SQL Editor and are never re-run from here.
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          ref = os.environ["SUPABASE_PROJECT_REF"]; tok = os.environ["SUPABASE_ACCESS_TOKEN"]
          def q(sql):
              req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/database/query",
                  data=json.dumps({"query": sql}).encode(), method="POST",
                  headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json",
                           "User-Agent": "MyAlpha-Deploy"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode() or "null")
              except urllib.error.HTTPError as e:
                  # Postgres error text only (RLS_LEAK / RLS_WRITE_NOT_BLOCKED …); never row data.
                  print("::error title=V6.11 SQL::" + e.read().decode()[:400]); raise
          for f in ("supabase/migrations/202610080002_investment_plans_private.sql",
                    "supabase/migrations/202610080003_dca_amount_usd.sql"):
              q(open(f, encoding="utf-8").read())
          rows = q("select c.relname as t, c.relrowsecurity as rls from pg_class c join pg_namespace n on n.oid=c.relnamespace "
                   "where n.nspname='public' and c.relname in ('investment_plan_settings','dca_monthly_plans','investment_executions') order by 1")
          print("::notice title=V6.11 migration::" + json.dumps(rows))
          assert len(rows) == 3 and all(r["rls"] for r in rows), rows
          cols = q("select table_name, column_name from information_schema.columns where table_schema='public' "
                   "and column_name in ('dca_monthly_usd','amount_usd') order by 1")
          print("::notice title=V6.11 USD columns::" + json.dumps(cols))
          assert len(cols) == 2, cols
          # Re-running both migrations above is the idempotency check; then audit isolation.
          audit = q(open("supabase/tests/v611_rls_isolation.sql", encoding="utf-8").read())
          a = (audit or [{}])[-1]
          # Public log: integrity checks only (expected zeros), never row counts of private tables.
          shown = {k: a.get(k) for k in ("audited_as", "duplicate_month_plans", "settings_unmigrated_cny",
                                          "plans_unmigrated_cny", "executions_cross_user_or_orphan", "policies")}
          print("::notice title=V6.11 RLS isolation (other user + anon)::PASS " + json.dumps(shown))
          assert a.get("audited_as") not in ("anon", "authenticated"), a  # counts must not be RLS-filtered
          assert a.get("duplicate_month_plans") == 0 and a.get("settings_unmigrated_cny") == 0 \
              and a.get("plans_unmigrated_cny") == 0 and a.get("executions_cross_user_or_orphan") == 0 \
              and a.get("policies") == 12, a
          PY
      - name: Apply forward-journal private table (idempotent, owner-only, append-only)
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          ref = os.environ["SUPABASE_PROJECT_REF"]; tok = os.environ["SUPABASE_ACCESS_TOKEN"]
          def q(sql):
              req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/database/query",
                  data=json.dumps({"query": sql}).encode(), method="POST",
                  headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json",
                           "User-Agent": "MyAlpha-Deploy"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode() or "null")
              except urllib.error.HTTPError as e:
                  print("::error title=Forward journal SQL::" + e.read().decode()[:400]); raise
          mig = open("supabase/migrations/202610090001_forward_journal_private.sql", encoding="utf-8").read()
          q(mig); q(mig)  # second run = idempotency check
          a = (q(open("supabase/tests/forward_journal_isolation.sql", encoding="utf-8").read()) or [{}])[-1]
          # Public log: integrity checks only, never row counts of the private table.
          shown = {k: a.get(k) for k in ("audited_as", "attested_not_live", "missing_sha", "policies", "triggers")}
          print("::notice title=Forward journal RLS / append-only audit::PASS " + json.dumps(shown))
          assert a.get("audited_as") not in ("anon", "authenticated"), a
          assert a.get("attested_not_live") == 0 and a.get("missing_sha") == 0 \
              and a.get("policies") == 2 and a.get("triggers") == 2, a
          PY
      - name: Apply option assignment-preference columns (idempotent; owner-only RLS unchanged)
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          ref = os.environ["SUPABASE_PROJECT_REF"]; tok = os.environ["SUPABASE_ACCESS_TOKEN"]
          def q(sql):
              req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/database/query",
                  data=json.dumps({"query": sql}).encode(), method="POST",
                  headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json", "User-Agent": "MyAlpha-Deploy"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read().decode() or "null")
              except urllib.error.HTTPError as e:
                  print("::error title=Assignment preference SQL::" + e.read().decode()[:400]); raise
          mig = open("supabase/migrations/202610100001_option_assignment_preference.sql", encoding="utf-8").read()
          q(mig); q(mig)
          a = (q(open("supabase/tests/option_assignment_preference_audit.sql", encoding="utf-8").read()) or [{}])[-1]
          # integrity facts only; never row data
          print("::notice title=Assignment preference audit::" + json.dumps(a))
          assert a.get("new_columns") == 2 and a.get("constraints") == 2 and a.get("rls_enabled") is True \
              and a.get("unconfirmed_claims") == 0 and (a.get("policies") or 0) >= 1, a
          PY
