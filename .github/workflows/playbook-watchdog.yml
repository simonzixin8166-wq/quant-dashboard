# Latest-main verification: 2026-10-06T03:50Z business-date recovery
name: Playbook Independent Watchdog

on:
  push:
    branches: [main]
    paths:
      - "docs/data.json"
      - "scripts/playbook_watchdog.py"
      - ".github/workflows/playbook-watchdog.yml"
  schedule:
    - cron: '17 */3 * * 1-6'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: myalpha-playbook-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Forward clock freshness and ledger health
        run: python scripts/playbook_watchdog.py
