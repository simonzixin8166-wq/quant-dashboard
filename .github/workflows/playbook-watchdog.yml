name: Playbook Independent Watchdog

on:
  schedule:
    - cron: '17 */3 * * 1-6'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: myalpha-playbook-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Forward clock freshness and ledger health
        run: python scripts/playbook_watchdog.py
