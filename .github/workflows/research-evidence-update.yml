name: Research Evidence Update

on:
  push:
    branches: [main]
    paths:
      - "scripts/v615_*.py"
      - "scripts/v616_*.py"
      - "scripts/evaluation_spec.py"
      - "scripts/entry_semantics.py"
      - "scripts/research_boundary_guard.py"
      - "scripts/run_research_step.py"
      - "research/specs/**"
      - ".github/workflows/research-evidence-update.yml"
  workflow_dispatch: {}
  schedule:
    - cron: '10 22 * * 1-5'

concurrency:
  group: myalpha-production-writer
  cancel-in-progress: false

jobs:
  compute:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install "yfinance>=0.2.65,<0.3" pandas
      - name: Boundary precheck
        run: python scripts/research_boundary_guard.py
      - name: Rule Registry invariant
        run: python scripts/run_research_step.py --name rule_registry -- python scripts/v615_rule_registry.py
      - name: Rule Family invariant
        run: python scripts/run_research_step.py --name rule_family -- python scripts/v615_rule_family.py
      - name: Source Store invariant
        run: python scripts/run_research_step.py --name source_store -- python scripts/v615_persistent_source_store.py --sources-only
      - name: Family feasibility invariant
        run: python scripts/run_research_step.py --name family_feasibility -- python scripts/v615_family_feasibility.py
      - name: EventScore invariant
        run: python scripts/run_research_step.py --name event_score -- python scripts/v615_event_score.py
      - name: Forward intake health invariant
        run: python scripts/run_research_step.py --name forward_intake_health -- python scripts/v615_forward_intake_health.py
      - name: Observational event invariant
        run: python scripts/run_research_step.py --name observational_events -- python scripts/v615_observational_events.py
      - name: STOOQ coverage audit invariant
        run: python scripts/run_research_step.py --name stooq_coverage -- python scripts/v615_cache_coverage_audit.py
      - name: Attribution invariant
        run: python scripts/run_research_step.py --name method_attribution -- python scripts/v615_method_attribution.py
      - name: Event history invariant
        run: python scripts/run_research_step.py --name event_history -- python scripts/v615_persistent_source_store.py --events-only
      - name: Scorecard invariant
        run: python scripts/run_research_step.py --name rule_scorecard -- python scripts/v615_rule_scorecard.py
      - name: Family Scorecard invariant
        run: python scripts/run_research_step.py --name family_scorecard -- python scripts/v615_family_scorecard.py
      - name: Contradiction invariant
        run: python scripts/run_research_step.py --name contradiction_memory -- python scripts/v615_contradiction_memory.py
      - name: Promotion gate invariant
        run: python scripts/run_research_step.py --name promotion_gate -- python scripts/v615_promotion_gate.py
      - name: Statistical controls invariant
        run: python scripts/run_research_step.py --name statistical_controls -- python scripts/v615_statistical_controls.py
      - name: Spec coexistence audit invariant
        run: python scripts/run_research_step.py --name spec_coexistence -- python scripts/v615_spec_coexistence_audit.py
      - name: Component manifest invariant
        run: python scripts/run_research_step.py --name component_manifest -- python scripts/v615_component_manifest.py
      - name: V6.16 readiness invariant
        run: python scripts/run_research_step.py --name v616_readiness -- python scripts/v616_readiness_gate.py
      - name: Readiness forecast invariant
        run: python scripts/run_research_step.py --name readiness_forecast -- python scripts/v616_readiness_forecast.py
      - name: Monthly evidence audit invariant
        run: python scripts/run_research_step.py --name monthly_evidence_audit -- python scripts/v615_monthly_evidence_audit.py
      - name: Append-only research history guard
        run: python scripts/v615_append_only_guard.py
      - name: Research regression tests
        run: |
          python tests/test_v6150_evaluation_boundary.py
          python tests/test_v6151_rule_registry.py
          python tests/test_v6152_event_score.py
          python tests/test_v6153_method_attribution.py
          python tests/test_v6154_persistence.py
          python tests/test_v6155_scorecard.py
          python tests/test_v6156_contradictions.py
          python tests/test_v6157_promotion_gate.py
          python tests/test_v6158a_cache_coverage.py
          python tests/test_v6158a_step_boundary.py
          python tests/test_v6158b_rule_family.py
          python tests/test_v6158b_entry_observational.py
          python tests/test_v6158b_family_statistics.py
          python tests/test_v6158c_statistical_controls.py
          python tests/test_v6158c_readiness_gate.py
          python tests/test_v6158c_spec_coexistence.py
          python tests/test_v6158c_component_manifest.py
          python tests/test_v6158c_monthly_audit.py
          python tests/test_v6158d_legacy_bypass.py
          python tests/test_v6158d_append_only.py
          python tests/test_v6158d_extractor_provenance.py
          python tests/test_v6158g_family_feasibility.py
          python tests/test_v6158i_forward_e2e.py
          python tests/test_v615_forward_intake_health.py
      - name: Final compute allowlist
        run: python scripts/research_boundary_guard.py --assert-worktree-research-only
      - name: Package research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v615-research-output
          path: research/
          if-no-files-found: error
          retention-days: 3

  commit:
    needs: compute
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download research artifacts
        uses: actions/download-artifact@v4
        with:
          name: v615-research-output
          path: research/
      - name: Commit allowlist precheck
        run: python scripts/research_boundary_guard.py --assert-worktree-research-only
      - name: Commit research artifacts only
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add research/
          python scripts/research_boundary_guard.py --assert-staged-research-only
          git commit -m "Research evidence update $(date -u +%Y-%m-%d)" || echo "No research changes"
          git pull --rebase origin main
          python scripts/research_boundary_guard.py --assert-staged-research-only
          git push origin HEAD:main
