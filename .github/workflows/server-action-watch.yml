# Latest-main verification: V6.15 post-audit session-aware quote freshness + QA chain
# Manual recovery trigger: 2026-10-07
name: Server Action Watch
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.run_reason != '' && format('Server Action Watch · {0}', inputs.run_reason) || 'Server Action Watch' }}

on:
  push:
    branches: [main]
    paths:
      - "scripts/server_action_engine.py"
      - "tests/test_v615_server_action_engine.py"
      - "tests/test_server_action_snapshot_freshness.py"
      - "scripts/private_learning_audit.py"
      - "tests/test_private_learning_audit.py"
      - ".github/workflows/server-action-watch.yml"
      - "scripts/investment_watch_engine.py"
      - "config/gold_etf_long_term_watch.json"
      - "config/monthly_dca_plan.json"
  # Refresh the sanitized snapshot as soon as a new completed-session dashboard
  # is published. The cron below is best-effort and GitHub throttles it heavily,
  # which previously left the snapshot judging the prior session for many hours.
  workflow_run:
    workflows: ["Daily Dashboard Update"]
    types: [completed]
  schedule:
    # US trading-day watch. Covers EDT/EST regular-session windows with some buffer.
    - cron: "*/30 13-22 * * 1-5"
    # V6.11 gold watch outside US hours (Asia/Europe gold session). Option action engine is skipped on this schedule.
    - cron: "20 0-12,23 * * 1-5"
    - cron: "20 23 * * 0"
  workflow_dispatch:
    inputs:
      notify_test:
        description: "Send one MyAlpha Telegram channel test message (V6.11 gold/DCA reminders)"
        type: boolean
        default: false
      run_reason:
        description: "Optional label (the guardian sets 'server-guardian <hour>')"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: myalpha-production-writer
  cancel-in-progress: false

jobs:
  action-watch:
    # A failed/cancelled Daily publishes no new market data; keep the previous fail-closed snapshot.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate server action engine
        run: |
          python -m py_compile scripts/server_action_engine.py
          python tests/test_v615_server_action_engine.py
          python tests/test_server_action_snapshot_freshness.py
          python tests/test_private_learning_audit.py
          python tests/test_forward_journal_audit.py
          python tests/test_investment_watch_engine.py

      - name: Build server-side action status and deliver alerts
        if: ${{ github.event_name != 'schedule' || github.event.schedule == '*/30 13-22 * * 1-5' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPTIONS_MARKET_ENDPOINT: ${{ vars.OPTIONS_MARKET_ENDPOINT }}
          MYALPHA_TG_BOT_TOKEN: ${{ secrets.MYALPHA_TG_BOT_TOKEN }}
          MYALPHA_TG_CHAT_ID: ${{ secrets.MYALPHA_TG_CHAT_ID }}
        run: python scripts/server_action_engine.py

      - name: Private learning audit (aggregate-only annotations, no files)
        # Diagnostic only: never blocks the action snapshot, never writes docs/.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/private_learning_audit.py

      - name: Forward journal continuity audit (enums only, no files)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/forward_journal_audit.py

      - name: Notification channel test (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_test }}
        continue-on-error: true
        env:
          MYALPHA_TG_BOT_TOKEN: ${{ secrets.MYALPHA_TG_BOT_TOKEN }}
          MYALPHA_TG_CHAT_ID: ${{ secrets.MYALPHA_TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          import server_action_engine as sa
          r = sa.send_telegram("MyAlpha｜V6.11 通知通道测试\n黄金分阶段建仓与月度定投提醒将通过此通道发送。此消息仅用于验证，无需操作。")
          print(f"::notice title=Notification channel test::delivery={r}")
          PY

      - name: Investment watch (gold staged buying + monthly DCA reminders)
        # Research/reminders only; never orders. Never blocks the action snapshot.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MYALPHA_TG_BOT_TOKEN: ${{ secrets.MYALPHA_TG_BOT_TOKEN }}
          MYALPHA_TG_CHAT_ID: ${{ secrets.MYALPHA_TG_CHAT_ID }}
        run: python scripts/investment_watch_engine.py

      - name: Save sanitized action health only
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/research/server_action_status.json
          for f in docs/research/investment_actions_status.json research/archive/gold_signal_journal.jsonl research/archive/gold_signal_outcomes.json; do
            [ -f "$f" ] && git add "$f"
          done
          python scripts/private_guardrail.py
          if ! git diff --cached --quiet; then
            git commit -m "update server action status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
