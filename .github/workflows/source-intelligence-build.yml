name: Source Intelligence Build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/source_intelligence_engine.py'
      - 'docs/data/brightline_2026_fulltext_insights.json'
      - 'docs/data/brightline_2026_q1.json'
      - 'docs/data/brightline_2026_q2.json'
      - 'docs/data/brightline_2026_q3.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: source-intelligence-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Source Intelligence
        run: python scripts/source_intelligence_engine.py
      - name: Validate
        run: |
          python tests/test_source_intelligence_engine.py
          python tests/test_source_intelligence_ui.py
      - name: Save generated intelligence
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/source_intelligence.json
          git diff --cached --quiet || git commit -m "build Source Intelligence V2"
          git pull --rebase origin main
          git push origin HEAD:main
