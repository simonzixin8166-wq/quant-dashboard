  schedule:
    # Runs after wxc-bot research-close (22:30 UTC) so new author research reaches MyAlpha the same cycle.
    - cron: "10 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Every workflow that writes generated production artifacts to main shares
  # one lock. This prevents successful builds from failing only at git push.
  group: myalpha-production-writer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy "yfinance>=0.2.65,<0.3"

      - name: Prebuild source coverage audit for validation
        run: python scripts/source_coverage_audit.py

      - name: Validate source-learning code
        run: |
          python -m py_compile scripts/research_program_status.py scripts/v615_author_intelligence.py scripts/cross_asset_divergence_engine.py scripts/breadth_intelligence_engine.py scripts/regime_combination_memory.py scripts/source_intelligence_engine.py scripts/source_coverage_audit.py scripts/source_reading_memory.py scripts/candidate_rule_compiler.py scripts/candidate_rule_replay.py scripts/candidate_forward_observer.py scripts/candidate_event_score.py scripts/candidate_family_scorecard.py scripts/candidate_rule_families.py scripts/autonomous_intelligence_status.py scripts/source_history_cache.py scripts/source_outcome_validation.py scripts/public_research_evidence_status.py scripts/evidence_attribution_engine.py scripts/method_memory_engine.py scripts/module_intelligence_engine.py scripts/autonomous_research_planner.py scripts/official_evidence_engine.py scripts/event_evidence_engine.py scripts/event_window_attribution.py scripts/autonomous_research_executor.py scripts/self_improvement_engine.py scripts/learning_evaluation_engine.py scripts/system_status_center.py scripts/autonomous_signal_governance.py
          python tests/test_source_intelligence_engine.py
          python tests/test_source_coverage_audit.py
          python tests/test_v615_youtube_historical_bridge.py
          python tests/test_v615_author_intelligence.py
          python tests/test_v615_program_status.py
          python tests/test_source_outcome_validation.py
          python tests/test_source_intelligence_ui.py
          python tests/test_v615_source_rule_public_status.py
          python tests/test_v570_evidence_attribution.py
          python tests/test_method_memory_engine.py
          python tests/test_v614_source_reading_memory.py
          python tests/test_candidate_rule_compiler.py
          python tests/test_candidate_rule_replay.py
          python tests/test_candidate_forward_observer.py
          python tests/test_candidate_event_score.py
          python tests/test_candidate_family_scorecard.py
          python tests/test_candidate_rule_families.py
          python tests/test_autonomous_intelligence_status.py
          python tests/test_v6143_source_rule_validation_queue.py
          node --check docs/assets/knowledge.js
          python tests/test_v610_module_intelligence.py
          python tests/test_v660_information_architecture.py
          python tests/test_v661_ui_consistency.py
          python tests/test_v663_completed_daily_guard.py
          python tests/test_v670_cross_asset_divergence.py
          python tests/test_breadth.py
          python tests/test_v680_breadth_intelligence.py
          python tests/test_v681_regime_combination_memory.py
          python tests/test_v680_breadth_ui.py
          python tests/test_v600_research_planner.py
          python tests/test_v630_official_evidence.py
          python tests/test_v640_event_evidence.py
          python tests/test_v650_event_window_attribution.py
          python tests/test_v620_research_executor.py
          python tests/test_v700_self_improvement.py
          python tests/test_v690_learning_evaluation.py
          python tests/test_v615_fundamental_outcome_context.py
          python tests/test_v615_learning_quality_weekly.py
          python tests/test_system_status_center.py
          python tests/test_v615_decision_authority.py
          python tests/test_autonomous_signal_governance.py
          node --check docs/assets/signal-policy.js
          python tests/test_v615_auto_thesis_engine.py
          python tests/test_v615_operator_decision_persistence.py
          python tests/test_v615_server_action_engine.py
          python tests/test_v615_option_learning_observations.py
          python tests/test_v615_option_learning_outcomes.py
          node --check docs/assets/decision-journal.js
          node --check docs/assets/product-intelligence.js
          node --check docs/assets/investment-assistant.js
          node --check scripts/autonomous_site_qa.mjs
          node --check docs/assets/wenxuecity.js

      - name: Build source intelligence
        run: python scripts/source_intelligence_engine.py

      - name: Audit continuous source coverage
        run: python scripts/source_coverage_audit.py

      - name: Build V6.15 Author Intelligence
        run: python scripts/v615_author_intelligence.py

      - name: Build V6.15 Auto Thesis drafts
        run: python scripts/v615_auto_thesis_engine.py

      - name: Build V6.14 Source Reading Memory
        run: python scripts/source_reading_memory.py

      - name: Compile Research Shadow Candidate Rules
        run: python scripts/candidate_rule_compiler.py

      - name: Observe Genuine Forward Candidate State Entries
        run: python scripts/candidate_forward_observer.py

      - name: Build Candidate EventScore Adapter
        run: python scripts/candidate_event_score.py

      - name: Build Candidate Family Shadow Scorecards
        run: python scripts/candidate_family_scorecard.py

      - name: Replay Research Shadow Candidate Rules
        run: python scripts/candidate_rule_replay.py

      - name: Build Research Shadow Rule Families
        run: python scripts/candidate_rule_families.py

      - name: Autofill missing source-validation history
        run: python scripts/source_history_cache.py

      - name: Build source outcome validation
        run: python scripts/source_outcome_validation.py

      - name: Build public Spec 1.5 evidence status
        run: python scripts/public_research_evidence_status.py

      - name: Rebuild evidence attribution
        run: python scripts/evidence_attribution_engine.py

      - name: Build Method Memory
        run: python scripts/method_memory_engine.py

      - name: Build V6.7 Cross-Asset Divergence
        run: python scripts/cross_asset_divergence_engine.py

      - name: Build V6.8 Breadth Intelligence
        run: python scripts/breadth_intelligence_engine.py

      - name: Build V6.8 Regime Combination Memory
        run: python scripts/regime_combination_memory.py

      - name: Audit V6.1 Module Intelligence Graph
        run: python scripts/module_intelligence_engine.py

      - name: Build V6 Autonomous Research Planner
        run: python scripts/autonomous_research_planner.py

      - name: Build V6.3 Official Evidence Layer
        run: python scripts/official_evidence_engine.py

      - name: Build V6.4 Event & Peer Evidence Layer
        run: python scripts/event_evidence_engine.py

      - name: Build V6.5 Event Window Attribution
        run: python scripts/event_window_attribution.py

      - name: Build V6.2 Autonomous Research Executor
        run: python scripts/autonomous_research_executor.py

      - name: Build V7 Self-Improvement Shadow Engine
        run: python scripts/self_improvement_engine.py

      - name: Build Fundamental Outcome Context
        run: python scripts/fundamental_outcome_context.py

      - name: Build V6.9 Learning Evaluation
        run: python scripts/learning_evaluation_engine.py

      - name: Build governed autonomous signal contract
        run: python scripts/autonomous_signal_governance.py

      - name: Build V6.15 program status
        run: python scripts/research_program_status.py

      - name: Build autonomous system status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/system_status_center.py

      - name: Build autonomous intelligence master status
        run: python scripts/autonomous_intelligence_status.py

      - name: Save generated learning outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/source_intelligence.json docs/research/source_coverage_audit.json docs/research/author_intelligence.json docs/research/auto_thesis_drafts.json docs/research/v615_program_status.json docs/research/source_reading_memory.json docs/research/candidate_rule_status.json research/registry/candidate_rules.json docs/research/candidate_forward_status.json research/history/candidate_forward_events.jsonl research/events/candidate_event_scores_v1.json docs/research/candidate_eventscore_status.json research/reports/candidate_family_scorecards.json docs/research/candidate_family_scorecard_status.json docs/research/candidate_rule_replay.json research/registry/candidate_rule_families.json docs/research/candidate_rule_family_status.json docs/research/source_outcome_validation.json docs/research/evidence_status.json docs/research/evidence_attribution.json docs/research/method_memory.json docs/research/module_intelligence.json docs/research/cross_asset_divergence.json docs/research/cross_asset_divergence_history.json docs/research/breadth_intelligence.json docs/research/breadth_intelligence_history.json docs/research/regime_combination_memory.json docs/research/regime_combination_history.json docs/research/research_planner.json docs/research/official_evidence.json docs/research/event_evidence.json docs/research/event_window_attribution.json docs/research/research_execution.json docs/research/self_improvement.json docs/research/fundamental_outcome_context.json docs/research/learning_evaluation.json docs/research/signal_governance.json docs/research/system_status.json docs/research/autonomous_intelligence_status.json
          if [ -f data/history/source_validation_history.zip ]; then git add data/history/source_validation_history.zip; fi
          if ! git diff --cached --quiet; then
            git commit -m "update source intelligence validation"
            # A developer/manual commit can advance main between pull and push.
            # Retry a bounded number of times instead of reporting a false
            # validation failure after all tests/builds have already passed.
            pushed=0
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Generated-output push raced with main (attempt $attempt/3); retrying..."
              sleep 2
            done
            test "$pushed" -eq 1
          fi
