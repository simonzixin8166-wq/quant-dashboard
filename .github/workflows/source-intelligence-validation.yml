name: Source Intelligence Validation

on:
  push:
    branches: [main]
    paths:
      - "docs/data/brightline_2026_fulltext_insights.json"
      - "scripts/source_intelligence_engine.py"
      - "scripts/source_outcome_validation.py"
      - "scripts/evidence_attribution_engine.py"
      - "docs/assets/wenxuecity.js"
      - ".github/workflows/source-intelligence-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-intelligence-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy "yfinance>=0.2.65,<0.3"

      - name: Validate source-learning code
        run: |
          python -m py_compile scripts/source_intelligence_engine.py scripts/source_history_cache.py scripts/source_outcome_validation.py scripts/evidence_attribution_engine.py scripts/system_status_center.py
          python tests/test_source_intelligence_engine.py
          python tests/test_source_outcome_validation.py
          python tests/test_source_intelligence_ui.py
          python tests/test_v570_evidence_attribution.py
          node --check docs/assets/wenxuecity.js

      - name: Build source intelligence
        run: python scripts/source_intelligence_engine.py

      - name: Autofill missing source-validation history
        run: python scripts/source_history_cache.py

      - name: Build source outcome validation
        run: python scripts/source_outcome_validation.py

      - name: Rebuild evidence attribution
        run: python scripts/evidence_attribution_engine.py

      - name: Build autonomous system status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/system_status_center.py

      - name: Save generated learning outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/source_intelligence.json docs/research/source_outcome_validation.json docs/research/evidence_attribution.json docs/research/system_status.json
          if [ -f data/history/source_validation_history.zip ]; then git add data/history/source_validation_history.zip; fi
          if ! git diff --cached --quiet; then
            git commit -m "update source intelligence validation"
            git push origin HEAD:main
          fi
