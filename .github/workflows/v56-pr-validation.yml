name: MyAlpha Production PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python test dependencies
        run: pip install "yfinance>=0.2.65,<0.3" pandas
      - name: JavaScript syntax
        run: |
          node --check docs/assets/options-v2.js
          node --check docs/assets/autonomous-agent.js
          node --check docs/assets/decision-journal.js
          node --check docs/assets/wenxuecity.js
          node --check docs/assets/research-methods.js
      - name: V6.8 opportunity regression
        run: |
          python tests/test_opportunity_strategy.py
          python tests/test_build_contract.py
      - name: Core learning regression contracts
        run: |
          python tests/test_v510_autonomous_assistant.py
          python tests/test_v520_decision_journal.py
          python tests/test_v530_local_history_agent.py
          python tests/test_v540_learning_engine_core.py
          python tests/test_v550_autonomous_agent.py
      - name: Autonomous learning regression contract
        run: |
          python tests/test_v560_autonomous_decision_intelligence.py
          python tests/test_v561_premium_income_purpose.py
          python tests/test_v562_autonomous_learning_loop.py
          python tests/test_v563_data_integrity_edge_ui.py
          python tests/test_v564_learning_policy.py
          python tests/test_source_intelligence_engine.py
          python tests/test_source_intelligence_ui.py
          python tests/test_source_history_cache.py
          python tests/test_source_outcome_validation.py
          python tests/test_v570_evidence_attribution.py
          python tests/test_v690_learning_evaluation.py
          python tests/test_v690_ui_hardening.py
          python tests/test_ui_controls.py
          python tests/test_system_status_center.py
          python tests/test_v610a_playbook_engine.py
          python tests/test_v610c_stabilization_p1.py
          python tests/test_v611_outcome_foundation.py
          python tests/test_v610d_late_detection.py
          python tests/test_v611_walk_forward_replay.py
      - name: V6.10b stabilization / research-only contract
        run: |
          python -m py_compile scripts/range_intelligence.py scripts/private_guardrail.py
          python tests/test_v610b_parallel_safety.py
      - name: Private-position static export guard
        run: python scripts/private_guardrail.py
