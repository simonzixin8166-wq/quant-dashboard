name: V5.6 PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check docs/assets/options-v2.js
          node --check docs/assets/autonomous-agent.js
          node --check docs/assets/decision-journal.js
      - name: V5.4/V5.5 regression contracts
        run: |
          python tests/test_v540_learning_engine_core.py
          python tests/test_v550_autonomous_agent.py
      - name: V5.6 deterministic contract
        run: |
          python tests/test_v560_autonomous_decision_intelligence.py
          python tests/test_v561_premium_income_purpose.py
      - name: Private-position static export guard
        run: |
          if grep -R -n -E '"(option_positions|private_positions|broker_account_id)"' docs/research docs/data.json 2>/dev/null; then
            echo "Private option position material detected in public static output"; exit 1;
          fi
          echo "Private static export guard PASS"
