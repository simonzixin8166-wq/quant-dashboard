name: V6.6.1 Market Refresh Retry

on:
  push:
    branches: [main]
    paths:
      - ".github/refresh-v661-market-retry.trigger"

permissions:
  contents: write

concurrency:
  group: v661-market-refresh-retry
  cancel-in-progress: false

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "yfinance>=0.2.65,<0.3" pandas

      - name: Validate market build scripts
        run: python -m py_compile scripts/fetch_and_build.py scripts/update_market_events.py

      - name: Update official event calendar
        continue-on-error: true
        run: python scripts/update_market_events.py

      - name: Fetch latest prices and rebuild market site
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_and_build.py

      - name: Validate refreshed site
        run: |
          node --check docs/assets/mobile-shell.js
          node --check docs/assets/autonomous-agent.js
          python tests/test_v660_information_architecture.py
          python tests/test_v661_ui_consistency.py

      - name: Commit market outputs only
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/index.html docs/data.json docs/data/market_events.json
          git commit -m "V6.6.1 refresh latest market snapshot" || echo "No market changes"
          git pull --rebase origin main
          git push origin HEAD:main
