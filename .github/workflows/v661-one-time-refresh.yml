name: V6.6.1 One-Time Full Refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/refresh-v661.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-v661-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "yfinance>=0.2.65,<0.3" pandas

      - name: Validate scripts
        run: python -m py_compile scripts/fetch_and_build.py scripts/update_market_events.py scripts/local_history_agent.py scripts/update_fred_macro.py scripts/learning_engine_core.py scripts/autonomous_research_agent.py scripts/source_intelligence_engine.py scripts/source_history_cache.py scripts/source_outcome_validation.py scripts/evidence_attribution_engine.py scripts/method_memory_engine.py scripts/module_intelligence_engine.py scripts/autonomous_research_planner.py scripts/official_evidence_engine.py scripts/event_evidence_engine.py scripts/event_window_attribution.py scripts/autonomous_research_executor.py scripts/self_improvement_engine.py scripts/system_status_center.py

      - name: Update official event calendar
        continue-on-error: true
        run: python scripts/update_market_events.py

      - name: Fetch latest prices and rebuild site
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_and_build.py

      - name: Update STOOQ history
        run: python scripts/local_history_agent.py

      - name: Update FRED macro
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_fred_macro.py

      - name: Rebuild learning stack
        run: |
          python scripts/learning_engine_core.py
          python scripts/autonomous_research_agent.py
          python scripts/source_intelligence_engine.py
          python scripts/source_history_cache.py
          python scripts/source_outcome_validation.py
          python scripts/evidence_attribution_engine.py
          python scripts/method_memory_engine.py
          python scripts/module_intelligence_engine.py
          python scripts/autonomous_research_planner.py
          python scripts/official_evidence_engine.py
          python scripts/event_evidence_engine.py
          python scripts/event_window_attribution.py
          python scripts/autonomous_research_executor.py
          python scripts/self_improvement_engine.py

      - name: Build system status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/system_status_center.py

      - name: Generate build manifest
        run: python scripts/generate_build_manifest.py

      - name: Validate generated site
        run: |
          node --check docs/assets/autonomous-agent.js
          node --check docs/assets/mobile-shell.js
          node --check docs/assets/options-v2.js
          python tests/test_v660_information_architecture.py
          python tests/test_v661_ui_consistency.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/ data/history/stooq_watchlist.zip
          if [ -f data/history/source_validation_history.zip ]; then git add data/history/source_validation_history.zip; fi
          git commit -m "V6.6.1 refresh latest market data" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main
