name: V6.6.2 One-Time Market Refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/refresh-v661.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-v662-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "yfinance>=0.2.65,<0.3" pandas

      - name: Update official event calendar
        continue-on-error: true
        run: python scripts/update_market_events.py

      - name: Fetch latest prices and rebuild site
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/fetch_and_build.py

      - name: Validate generated market site
        run: |
          node --check docs/assets/mobile-shell.js
          node --check docs/assets/autonomous-agent.js
          python tests/test_v660_information_architecture.py
          python tests/test_v661_ui_consistency.py

      - name: Commit only market-page outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data.json docs/index.html docs/data/market_events.json
          git commit -m "V6.6.2 refresh latest market page" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main
